<text x="80" y="1302" font-size="31" font-weight="700" text-anchor="start" fill="#172b3a">Las tuercas sujetan las tapas; las juntas impiden que entre agua.</text>
<text x="80" y="1347" font-size="24" font-weight="400" text-anchor="start" fill="#526574">Boceto conceptual · sin escala · espesor de tapas y dimensiones de juntas pendientes</text>
