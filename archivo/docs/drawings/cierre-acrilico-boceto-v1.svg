<pattern id="hatch-cap" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e6e0f5"/><line x1="0" y1="0" x2="0" y2="12" stroke="#c0b4df" stroke-width="2"/></pattern>
<pattern id="hatch-tube" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)"><rect width="10" height="10" fill="#dff2f8"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b8dfe9" stroke-width="2"/></pattern>
