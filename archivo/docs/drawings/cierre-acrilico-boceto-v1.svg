<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title desc">
<title id="title">Boceto del cierre acrílico con junta axial y tirantes exteriores</title>
<desc id="desc">Corte longitudinal del tubo con dos tapas, dos tirantes visibles y juntas naranjas; ampliación de una junta alojada en la tapa y vista frontal con una tórica completa y cuatro tirantes.</desc>
