<text x="1217" y="1051" font-size="25" font-weight="400" text-anchor="middle" fill="#ad5c13">circular completa</text>
<text x="989" y="1220" font-size="25" font-weight="400" text-anchor="start" fill="#172b3a">4 tirantes alrededor del tubo</text>
